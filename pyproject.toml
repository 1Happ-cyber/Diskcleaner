[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-disk-cleaner"
version = "0.2.0"
description = "磁盘占用分析与安全清理工具（面向对象方法学课程大作业）"
requires-python = ">=3.12"
dependencies = ["Send2Trash>=1.8.3,<2"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.16,<7", "ruff>=0.6", "coverage>=7.6"]

[tool.setuptools]
packages = ["diskcleaner"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["diskcleaner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
